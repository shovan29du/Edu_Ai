services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
